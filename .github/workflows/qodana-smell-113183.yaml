# 113183 - Dragos Ariton
name: Qodana smell gate 113183
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana-113183:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-113183.yaml
          use-annotations: true
          post-pr-comment: true
          upload-result: true
          pr-mode: ${{ github.event_name == 'pull_request' }}