
# 129818 - Inês Aleixo
name: Qodana smell gate 129818

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana-129818:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Verify Qodana configuration
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la

          echo "=== QODANA YAML ==="
          cat qodana-129818.yaml

          echo "=== CUSTOM PROFILE ==="
          cat .qodana/profiles/profile-129818.yaml

          echo "=== TRACKED FILES ==="
          git ls-files | grep -E 'qodana-129818.yaml|profile-129818.yaml'

      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129818.yaml --profile-path .qodana/profiles/profile-129818.yaml
          use-annotations: true
          post-pr-comment: true
          upload-result: true
          pr-mode: false
