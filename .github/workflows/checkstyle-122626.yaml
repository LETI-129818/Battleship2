# 122626 Jorge Fernandes
name: Checkstyle naming gate 122626

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkstyle
        uses: dbelyaev/action-checkstyle@v0.4.7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-122626.xml
          level: error
          reporter: github-pr-review
          filter_mode: added
          fail_on_error: true