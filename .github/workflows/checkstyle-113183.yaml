# 113183 - Dragos Ariton
name: Checkstyle naming gate 113183
on:
  pull_request:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  checkstyle-113183:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-113183.xml
          reporter: github-pr-check
          level: error
          fail_level: error