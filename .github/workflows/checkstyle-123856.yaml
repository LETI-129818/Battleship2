
# 123856 - Tiago Vaz
name: Checkstyle naming gate 123856

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  checkstyle:
    name: Checkstyle naming check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkstyle
        uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-123856.xml
          reporter: github-pr-check
          level: error
          filter_mode: nofilter
          fail_level: error
